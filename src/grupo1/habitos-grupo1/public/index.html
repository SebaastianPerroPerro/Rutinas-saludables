<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Hábitos — Nuevo hábito</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <main class="contenedor">
        <header class="cabecera">
            <h1>Mis Hábitos</h1>
            <!-- Enlace a la pantalla de listado y gestión (Grupo 2) -->
            <a id="ir-gestion" class="boton-enlace" href="../../../grupo2/public/index.html">Gestionar hábitos →</a>
        </header>

        <!-- HU-01: pantalla "Nuevo hábito" -->
        <section class="tarjeta" id="pantalla-nuevo-habito">
            <h2>Nuevo hábito</h2>
            <form id="form-habito" novalidate>
                <label for="nombre">Nombre *</label>
                <input id="nombre" name="nombre" type="text" maxlength="50" placeholder="Ej: Leer 20 minutos" />
                <small class="error" id="error-nombre"></small>

                <label for="descripcion">Descripción (opcional)</label>
                <textarea id="descripcion" name="descripcion" maxlength="200" rows="2"></textarea>
                <small class="error" id="error-descripcion"></small>

                <label for="metaSemanal">Meta semanal (veces por semana, 1 - 7) *</label>
                <input id="metaSemanal" name="metaSemanal" type="number" min="1" max="7" placeholder="Ej: 3" />
                <small class="error" id="error-metaSemanal"></small>

                <fieldset id="campo-color" class="colores">
                    <legend>Color *</legend>
                    <div id="paleta" class="paleta"></div>
                </fieldset>
                <small class="error" id="error-color"></small>

                <button type="submit" id="btn-guardar">Guardar</button>
                <p id="mensaje" class="mensaje" role="status"></p>
            </form>
        </section>

        <section class="tarjeta">
            <h2>Hábitos creados</h2>
            <ul id="lista-habitos"></ul>
        </section>
    </main>
    <script type="module" src="js/app.js"></script>
</body>
</html>
